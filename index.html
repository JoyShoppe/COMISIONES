<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculadora de Comisión</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <div class="calculator-container">
    <h1 class="title">Calculadora de Comisión</h1>
    <form id="comisionForm">
      <div class="input-group">
        <label for="puntos">Intenciones:</label>
        <input type="number" id="puntos" required>
      </div>

      <div class="input-group">
        <label for="efectividad">Efectividad (%):</label>
        <input type="number" id="efectividad" required step="0.01">
      </div>

      <div class="input-group">
        <label for="caidaFront">Caída Front (%):</label>
        <input type="number" id="caidaFront" required step="0.01">
      </div>

      <div class="input-group">
        <label for="csat">CSAT:</label>
        <input type="number" id="csat" required step="0.01">
      </div>

      <div class="penalty-group">
        <label for="amonestaciones">Amonestaciones:</label>
        <input type="number" id="amonestaciones" min="0">
      </div>

      <div class="penalty-group">
        <label for="suspensiones">Suspensiones:</label>
        <input type="number" id="suspensiones" min="0">
      </div>

      <div class="penalty-group">
        <label for="ausentismos">Ausentismos:</label>
        <input type="number" id="ausentismos" min="0">
      </div>

      <div class="penalty-group">
        <label for="malasPracticas">Malas Prácticas:</label>
        <input type="number" id="malasPracticas" min="0">
      </div>

      <button type="submit" class="btn-calculate">Calcular Comisión</button>
    </form>
  </div>

  <!-- Modal de resultado -->
  <div id="modalResultado" class="modal hidden">
    <div class="modal-content">
      <span id="closeModal" class="close">&times;</span>
      <h2>Tu comisión será:</h2>
      <p class="result-amount"></p>
      <div id="penaltyDetails" class="penalty-details"></div>
    </div>
  </div>

  <script src="js/script.js"></script>
</body>
</html>
